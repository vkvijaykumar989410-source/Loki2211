<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050805">
<title>Diana & Loki — Voice Assistant</title>
<style>
:root{--green:#39ff14;--bg:#050805;--panel:#101610;--muted:#a9b5a9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#fff;font-family:Arial,Helvetica,sans-serif}
.app{width:min(100%,480px);min-height:100svh;margin:auto;padding:16px 18px 24px;display:flex;flex-direction:column;align-items:center;overflow:hidden}
h1{font-size:21px;letter-spacing:1.2px;margin:8px 0 3px}
.subtitle{font-size:12px;color:var(--muted);margin-bottom:12px}
.selectors{display:flex;gap:9px;width:100%;margin:5px 0 8px}
select,button{font:inherit;color:#fff;background:#101610;border:1px solid #287c24;border-radius:12px}
select{min-width:0;flex:1;padding:11px}
.avatar-area{height:min(49vh,470px);width:100%;display:flex;align-items:center;justify-content:center}
.avatar{height:100%;max-width:100%;object-fit:contain;filter:drop-shadow(0 0 12px #164d12)}
.fallback{width:205px;height:290px;border:2px solid var(--green);border-radius:110px 110px 35px 35px;display:grid;place-content:center;text-align:center;color:var(--green);font-size:23px}
.fallback small{font-size:12px;color:var(--muted);margin-top:8px}
.wave{width:100%;height:66px;display:flex;align-items:center;justify-content:center;gap:4px;margin:3px 0 13px}
.wave span{width:4px;height:7px;border-radius:8px;background:var(--green);opacity:.8}
.wave.active span{animation:wave .45s ease-in-out infinite alternate}
.wave.active span:nth-child(3n){animation-delay:.12s}.wave.active span:nth-child(4n){animation-delay:.23s}
@keyframes wave{to{height:36px}}
.actions{width:100%;display:flex;align-items:center;gap:12px}
.speak{flex:1;padding:16px 12px;border:2px solid var(--green);border-radius:40px;background:#050805;box-shadow:0 0 13px #147e0e;font-size:18px;font-weight:700}
.speak.listening{background:#10200d}
.plus-area{position:relative}
.plus{width:58px;height:58px;border:2px solid var(--green);border-radius:50%;font-size:30px;padding:0;box-shadow:0 0 12px #147e0e}
.menu{display:none;position:absolute;right:0;bottom:68px;width:166px;padding:7px;background:#101610;border:1.5px solid var(--green);border-radius:14px;z-index:5;box-shadow:0 0 12px #146d10}
.menu.open{display:block}
.menu button{width:100%;padding:11px;text-align:left;border:0;background:transparent;font-size:14px}
#cameraPreview{display:none;width:100%;max-height:180px;object-fit:cover;border:1px solid var(--green);border-radius:12px;margin-top:12px}
.status{min-height:32px;margin-top:12px;text-align:center;color:var(--muted);font-size:12px;line-height:1.4}
@media(max-height:690px){.avatar-area{height:40vh}.wave{height:48px;margin-bottom:8px}}
</style>
</head>
<body>
<main class="app">
  <h1>VOICE ASSISTANT</h1>
  <div class="subtitle">Diana &amp; Loki</div>

  <div class="selectors">
    <select id="character" aria-label="Choose assistant">
      <option value="Diana">Diana</option>
      <option value="Loki">Loki</option>
    </select>
    <select id="language" aria-label="Choose language">
      <option value="en-US">English</option>
      <option value="ta-IN">தமிழ்</option>
      <option value="hi-IN">हिन्दी</option>
      <option value="ml-IN">മലയാളം</option>
    </select>
  </div>

  <section class="avatar-area" aria-label="Assistant avatar">
    <!-- Place diana.png and loki.png beside this HTML file. -->
    <img id="avatar" class="avatar" src="diana.png" alt="Diana avatar">
    <div id="fallback" class="fallback" hidden>Diana<small>Add diana.png / loki.png</small></div>
  </section>

  <div id="wave" class="wave" aria-label="Live voice activity"></div>

  <div class="actions">
    <button id="speak" class="speak" type="button">🎙 &nbsp; SPEAK</button>
    <div class="plus-area">
      <button id="plus" class="plus" type="button" aria-label="Attachments" aria-expanded="false">+</button>
      <div id="menu" class="menu">
        <button type="button" data-action="photo">▧ &nbsp; Photo</button>
        <button type="button" data-action="camera">▣ &nbsp; Camera</button>
        <button type="button" data-action="document">▤ &nbsp; Document</button>
      </div>
    </div>
  </div>

  <input id="photoInput" type="file" accept="image/*" hidden>
  <input id="documentInput" type="file" accept=".pdf,.doc,.docx,.txt" hidden>
  <video id="cameraPreview" autoplay playsinline muted></video>
  <div id="status" class="status" role="status" aria-live="polite">Ready</div>
</main>

<script>
(() => {
  "use strict";
  const el = id => document.getElementById(id);
  const character = el("character"), language = el("language");
  const avatar = el("avatar"), fallback = el("fallback");
  const speakButton = el("speak"), plus = el("plus"), menu = el("menu");
  const wave = el("wave"), status = el("status"), preview = el("cameraPreview");
  const photoInput = el("photoInput"), documentInput = el("documentInput");

  let revision = 0;                 // Invalidates stale async callbacks.
  let listening = false;
  let restarting = false;
  let recognition = null;
  let recognitionSupported = false;
  let cameraStream = null;
  let micStream = null;
  let audioContext = null;
  let analyser = null;
  let sourceNode = null;
  let rafId = 0;
  let utterance = null;
  let restartTimer = 0;
  let intentionalStop = false;
  let lastFinalTranscript = "";

  for (let i = 0; i < 49; i++) wave.appendChild(document.createElement("span"));
  const bars = [...wave.children];

  function sayStatus(message) { status.textContent = message; }
  function setWaveActive(active) { wave.classList.toggle("active", active); }

  function stopTTS() {
    if ("speechSynthesis" in window) {
      try { window.speechSynthesis.cancel(); } catch (_) {}
    }
    utterance = null;
  }

  function stopRecognition() {
    intentionalStop = true;
    clearTimeout(restartTimer);
    restartTimer = 0;
    const old = recognition;
    recognition = null;
    if (old) {
      old.onstart = old.onresult = old.onerror = old.onend = null;
      try { old.abort(); } catch (_) { try { old.stop(); } catch (_) {} }
    }
    restarting = false;
  }

  function stopAudio() {
    cancelAnimationFrame(rafId);
    rafId = 0;
    setWaveActive(false);
    bars.forEach(bar => bar.style.height = "7px");
    if (sourceNode) { try { sourceNode.disconnect(); } catch (_) {} sourceNode = null; }
    analyser = null;
    if (audioContext) {
      const oldContext = audioContext;
      audioContext = null;
      try { oldContext.close(); } catch (_) {}
    }
    if (micStream) {
      micStream.getTracks().forEach(track => track.stop());
      micStream = null;
    }
  }

  function stopCamera() {
    if (cameraStream) {
      cameraStream.getTracks().forEach(track => track.stop());
      cameraStream = null;
    }
    preview.pause();
    preview.srcObject = null;
    preview.style.display = "none";
  }

  function stopAllMedia() {
    stopRecognition();
    listening = false;
    speakButton.classList.remove("listening");
    speakButton.textContent = "🎙  SPEAK";
    stopTTS();
    stopAudio();
    stopCamera();
  }

  function changeCharacter(name) {
    ++revision;
    stopAllMedia();
    menu.classList.remove("open");
    plus.setAttribute("aria-expanded", "false");
    const currentRevision = revision;
    avatar.hidden = false;
    fallback.hidden = true;
    avatar.alt = name + " avatar";
    avatar.onerror = () => {
      if (currentRevision !== revision) return;
      avatar.hidden = true;
      fallback.hidden = false;
      fallback.firstChild.textContent = name;
    };
    avatar.src = name.toLowerCase() + ".png";
    sayStatus(name + " is ready");
  }

  function drawAnalyser(currentRevision) {
    if (currentRevision !== revision || !listening || !analyser) return;
    const values = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(values);
    bars.forEach((bar, index) => {
      const value = values[Math.floor(index * values.length / bars.length)] || 0;
      bar.style.height = (5 + value * 0.22) + "px";
    });
    rafId = requestAnimationFrame(() => drawAnalyser(currentRevision));
  }

  async function startAudioVisualizer(currentRevision) {
    try {
      if (!navigator.mediaDevices?.getUserMedia) throw new Error("Microphone API unavailable");
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      if (currentRevision !== revision || !listening) {
        stream.getTracks().forEach(track => track.stop());
        return;
      }
      micStream = stream;
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) throw new Error("Web Audio API unavailable");
      const context = new AudioContextClass();
      audioContext = context;
      if (context.state === "suspended") await context.resume();
      if (currentRevision !== revision || !listening || audioContext !== context) {
        try { await context.close(); } catch (_) {}
        return;
      }
      analyser = context.createAnalyser();
      analyser.fftSize = 128;
      sourceNode = context.createMediaStreamSource(stream);
      sourceNode.connect(analyser);
      setWaveActive(true);
      drawAnalyser(currentRevision);
    } catch (error) {
      if (currentRevision === revision) sayStatus("Voice input may work, but live waveform is unavailable. Check microphone permission.");
    }
  }

  function makeRecognition() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) return null;
    const rec = new SpeechRecognition();
    rec.lang = language.value;
    rec.continuous = true;
    rec.interimResults = true;
    rec.maxAlternatives = 1;
    return rec;
  }

  function startRecognitionInstance(currentRevision) {
    if (!listening || currentRevision !== revision || restarting) return;
    const rec = makeRecognition();
    if (!rec) {
      listening = false;
      stopAudio();
      speakButton.classList.remove("listening");
      speakButton.textContent = "🎙  SPEAK";
      sayStatus("Continuous speech recognition is not supported here. Try Chrome on Android.");
      return;
    }
    recognition = rec;
    restarting = true;
    lastFinalTranscript = "";

    rec.onstart = () => {
      if (currentRevision !== revision || recognition !== rec) return;
      restarting = false;
      sayStatus("Listening continuously… speak now");
    };

    rec.onresult = event => {
      if (currentRevision !== revision || recognition !== rec || !listening) return;
      let interim = "";
      let finalText = "";
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const phrase = event.results[i][0]?.transcript || "";
        if (event.results[i].isFinal) finalText += phrase;
        else interim += phrase;
      }
      if (interim) sayStatus("Hearing: " + interim);
      if (finalText.trim()) {
        const text = finalText.trim();
        lastFinalTranscript = text;
        // Pause recognition while TTS speaks to avoid the assistant hearing itself.
        speakResponse(text, currentRevision);
      }
    };

    rec.onerror = event => {
      if (currentRevision !== revision || recognition !== rec) return;
      if (event.error === "not-allowed" || event.error === "service-not-allowed") {
        listening = false;
        stopRecognition();
        stopAudio();
        speakButton.classList.remove("listening");
        speakButton.textContent = "🎙  SPEAK";
        sayStatus("Microphone permission was denied.");
      } else if (event.error !== "no-speech" && event.error !== "aborted") {
        sayStatus("Speech recognition: " + event.error + ". Reconnecting…");
      }
    };

    rec.onend = () => {
      if (currentRevision !== revision || recognition !== rec) return;
      recognition = null;
      restarting = false;
      if (listening && !intentionalStop) {
        clearTimeout(restartTimer);
        restartTimer = setTimeout(() => startRecognitionInstance(currentRevision), 350);
      }
    };

    intentionalStop = false;
    try { rec.start(); }
    catch (_) {
      recognition = null;
      restarting = false;
      if (listening) {
        clearTimeout(restartTimer);
        restartTimer = setTimeout(() => startRecognitionInstance(currentRevision), 600);
      }
    }
  }

  function pauseRecognitionForSpeech(currentRevision) {
    clearTimeout(restartTimer);
    const old = recognition;
    recognition = null;
    restarting = false;
    if (old) {
      old.onstart = old.onresult = old.onerror = old.onend = null;
      try { old.abort(); } catch (_) { try { old.stop(); } catch (_) {} }
    }
    stopAudio();
  }

  function speakResponse(userText, currentRevision) {
    if (currentRevision !== revision || !listening) return;
    pauseRecognitionForSpeech(currentRevision);
    stopTTS();
    const response = character.value + " heard you say: " + userText;
    if (!("speechSynthesis" in window)) {
      sayStatus("You said: " + userText + ". Text-to-speech is unavailable.");
      resumeContinuousListening(currentRevision);
      return;
    }
    const msg = new SpeechSynthesisUtterance(response);
    msg.lang = language.value;
    msg.rate = 0.95;
    msg.pitch = character.value === "Diana" ? 1.05 : 0.9;
    utterance = msg;
    msg.onstart = () => {
      if (currentRevision !== revision) return;
      setWaveActive(true);
      sayStatus(character.value + " is speaking…");
    };
    const finish = () => {
      if (currentRevision !== revision || utterance !== msg) return;
      utterance = null;
      setWaveActive(false);
      resumeContinuousListening(currentRevision);
    };
    msg.onend = finish;
    msg.onerror = finish;
    try { window.speechSynthesis.speak(msg); }
    catch (_) { finish(); }
  }

  async function resumeContinuousListening(currentRevision) {
    if (currentRevision !== revision || !listening) return;
    sayStatus("Restarting voice listening…");
    await startAudioVisualizer(currentRevision);
    if (currentRevision !== revision || !listening) return;
    startRecognitionInstance(currentRevision);
  }

  async function beginListening() {
    if (listening) return;
    ++revision;
    const currentRevision = revision;
    stopAllMedia();
    listening = true;
    speakButton.classList.add("listening");
    speakButton.textContent = "■  STOP";
    await startAudioVisualizer(currentRevision);
    if (currentRevision !== revision || !listening) return;
    startRecognitionInstance(currentRevision);
  }

  function endListening(message = "Listening stopped") {
    ++revision;
    stopAllMedia();
    sayStatus(message);
  }

  async function openCamera() {
    const currentRevision = revision;
    stopCamera();
    try {
      if (!navigator.mediaDevices?.getUserMedia) throw new Error("Camera API unavailable");
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      if (currentRevision !== revision) {
        stream.getTracks().forEach(track => track.stop());
        return;
      }
      cameraStream = stream;
      preview.srcObject = stream;
      preview.style.display = "block";
      sayStatus("Camera is active. It will stop when you change assistant/language or leave the page.");
    } catch (_) {
      sayStatus("Camera permission denied or camera unavailable.");
    }
  }

  character.addEventListener("change", () => changeCharacter(character.value));
  language.addEventListener("change", () => {
    ++revision;
    stopAllMedia();
    sayStatus("Language changed to " + language.options[language.selectedIndex].text + ". Press SPEAK to start again.");
  });

  speakButton.addEventListener("click", () => {
    if (listening) endListening();
    else beginListening();
  });

  plus.addEventListener("click", () => {
    const open = menu.classList.toggle("open");
    plus.setAttribute("aria-expanded", String(open));
  });

  menu.addEventListener("click", event => {
    const action = event.target.closest("[data-action]")?.dataset.action;
    if (!action) return;
    menu.classList.remove("open");
    plus.setAttribute("aria-expanded", "false");
    if (action === "photo") photoInput.click();
    if (action === "document") documentInput.click();
    if (action === "camera") openCamera();
  });

  photoInput.addEventListener("change", () => {
    if (photoInput.files?.[0]) sayStatus("Photo selected: " + photoInput.files[0].name);
  });
  documentInput.addEventListener("change", () => {
    if (documentInput.files?.[0]) sayStatus("Document selected: " + documentInput.files[0].name);
  });

  // Release every owned stream and speech task on navigation/backgrounding.
  window.addEventListener("pagehide", () => { ++revision; stopAllMedia(); });
  window.addEventListener("beforeunload", () => { ++revision; stopAllMedia(); });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { ++revision; stopAllMedia(); }
  });

  changeCharacter("Diana");
})();
</script>
</body>
</html>
