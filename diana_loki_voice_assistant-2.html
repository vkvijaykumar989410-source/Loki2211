<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voice AI Assistant</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Voice AI Assistant</h1>
    <p id="status">Ready</p>

    <section class="settings">
      <h2>Gemini API</h2>
      <input id="geminiKey" type="password"
             placeholder="Gemini API key">
      <button id="toggleGemini">Show / Hide</button>
      <button id="saveGemini">Save / Update</button>
      <button id="deleteGemini">Delete</button>

      <h2>ElevenLabs API</h2>
      <input id="elevenKey" type="password"
             placeholder="ElevenLabs API key">
      <button id="toggleEleven">Show / Hide</button>

      <input id="voiceId" type="text"
             placeholder="ElevenLabs Voice ID">
      <button id="saveEleven">Save / Update</button>
      <button id="deleteEleven">Delete</button>
    </section>

    <label for="language">Response language</label>
    <select id="language">
      <option value="ta-IN">Tamil</option>
      <option value="en-US">English</option>
      <option value="hi-IN">Hindi</option>
      <option value="ml-IN">Malayalam</option>
    </select>

    <section class="controls">
      <button id="startMic">Start Speaking</button>
      <button id="stopAll">Stop</button>
      <button id="startCamera">Start Camera</button>
      <button id="capture">Capture & Ask</button>
      <button id="stopCamera">Stop Camera</button>
    </section>

    <video id="camera" autoplay playsinline muted></video>
    <canvas id="snapshot" hidden></canvas>
  </main>

  <script src="integration.js"></script>
</body>
</html>
